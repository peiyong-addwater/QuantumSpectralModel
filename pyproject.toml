[project]
name = "qfmhamembed"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax[cuda12]>=0.9.2; sys_platform == 'linux'",
    "flax>=0.12.6",
    "plotly>=6.7.0",
    "pytest>=9.0.2",
    "seaborn>=0.13.2",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    "optax>=0.2.8",
    "orbax>=0.1.9",
    "pandas>=3.0.1",
    "ruff>=0.14.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ipykernel>=7.2.0",
    "scienceplots>=2.2.1",
    "scikit-learn>=1.8.0",
    "h5py>=3.16.0",
    "pennylane>=0.45.0",
]


[tool.uv]
cache-dir = ".cache/uv"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notes/assets/RefCode"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
